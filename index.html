<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>文字起こし</title>

<style>
  :root{
    --ink:#f2f0ec;
    --dim:#7c8590;
    --bg:#0e1216;
    --panel:#171d23;
    --line:#28313a;
    --live:#4ad4a0;
    --interim:#6fa8dc;
    --err:#e8695f;
    --info:#8db4ff;
  }

  *{box-sizing:border-box;margin:0;padding:0;min-width:0}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    -webkit-text-size-adjust:100%;
  }

  /* ---------- 操作バー ---------- */

  .bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    flex:0 0 auto;
  }

  .bar button{
    padding:12px 18px;
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:8px;
    font:600 15px/1 -apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  .bar button:active{background:#222b33}
  .bar button:disabled{opacity:.28}

  #rec{
    width:10px;height:10px;border-radius:50%;
    background:var(--line);
    flex:0 0 auto;
    transition:background 120ms;
  }
  #rec.on{background:var(--live)}

  .meter{
    flex:1 1 auto;
    height:6px;
    background:var(--panel);
    border-radius:3px;
    overflow:hidden;
  }
  #bar{
    height:100%;width:0%;
    background:var(--live);
    transition:width 70ms linear;
  }

  /* ---------- 本文 ---------- */

  #text{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 2px 12px;
    font-size:21px;
    line-height:1.75;
    letter-spacing:.01em;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  #text p{
    margin-bottom:14px;
    color:var(--ink);
  }

  /* 中間結果。確定行と同じ位置・同じ字送りで色だけ違う */
  #interim{
    color:var(--interim);
    margin-bottom:14px;
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  #interim:empty{display:none}

  /* 校正中はごくわずかに沈める。色は変えない */
  #text p.correcting{}

  /* ---------- 折りたたみ ---------- */

  details{
    flex:0 0 auto;
    border-top:1px solid var(--line);
    font-size:13px;
  }

  summary{
    padding:11px 2px;
    color:var(--dim);
    font-size:12px;
    letter-spacing:.12em;
    list-style:none;
    -webkit-tap-highlight-color:transparent;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:" ▾"}
  details[open] summary::after{content:" ▴"}

  .pane{
    max-height:42vh;
    overflow-y:auto;
    padding-bottom:12px;
  }

  input{
    width:100%;
    padding:13px;
    margin-bottom:8px;
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    font:400 15px/1 -apple-system,sans-serif;
  }
  input[name=username]{display:none}

  label{
    display:block;
    color:var(--dim);
    font-size:11px;
    letter-spacing:.1em;
    margin:6px 0 4px;
  }

  dl{
    display:grid;
    grid-template-columns:1fr auto;
    gap:3px 12px;
    margin-bottom:10px;
  }
  dt{color:var(--dim);font-size:12px}
  dd{
    text-align:right;
    font:400 12px/1.5 ui-monospace,Menlo,monospace;
    font-variant-numeric:tabular-nums;
  }

  #log{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px;
    font:400 11px/1.65 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;
    word-break:break-all;
    max-height:34vh;
    overflow-y:auto;
    color:var(--dim);
  }
  #log .ok{color:var(--live)}
  #log .ng{color:var(--err)}
  #log .corr{color:var(--info)}
</style>
</head>

<body>

<div class="bar">
  <div id="rec"></div>
  <button id="start">開始</button>
  <button id="stop" disabled>停止</button>
  <div class="meter"><div id="bar"></div></div>
</div>

<div id="text">
  <p id="interim"></p>
</div>

<details id="cfg">
  <summary>設定・診断</summary>
  <div class="pane">

    <form id="amiform" autocomplete="on">
      <label>AMIVOICE APPKEY</label>
      <input type="text" name="username" autocomplete="username" value="amivoice">
      <input type="password" id="key" name="password"
             autocomplete="current-password" placeholder="AmiVoice APPKEY">
    </form>

    <form id="oaiform" autocomplete="on">
      <label>OPENAI API KEY（空なら校正しない）</label>
      <input type="text" name="username" autocomplete="username" value="openai">
      <input type="password" id="openaiKey" name="password"
             autocomplete="current-password" placeholder="OpenAI API Key">
    </form>

    <dl>
      <dt>入力レート</dt><dd id="sr">—</dd>
      <dt>送信レート</dt><dd id="out">—</dd>
      <dt>送信バイト数</dt><dd id="sent">0</dd>
      <dt>中間結果 U</dt><dd id="uCount">0</dd>
      <dt>確定発話数</dt><dd id="utt">0</dd>
      <dt>校正済み</dt><dd id="corrCount">0</dd>
      <dt>校正待ち</dt><dd id="corrQueue">0</dd>
      <dt>校正棄却</dt><dd id="rejCount">0</dd>
    </dl>

    <button id="copy" style="width:100%;padding:13px;background:var(--panel);
      color:var(--ink);border:1px solid var(--line);border-radius:6px;
      font:600 14px -apple-system,sans-serif;margin-bottom:10px">全文をコピー</button>

    <div id="log">待機中。</div>

  </div>
</details>

<script>

const $ = id => document.getElementById(id);

/* =========================================================
   設定
   ========================================================= */

const WS_URL   = "wss://acp-api.amivoice.com/v1/nolog/";
const OUT_RATE = 16000;
const CHUNK    = 8000;                 // 0.5 秒

const OPENAI_URL   = "https://api.openai.com/v1/responses";
const OPENAI_MODEL = "gpt-5.6-luna";

const CORRECT_TIMEOUT = 12000;         // 校正の打ち切り
const CORRECT_MIN_LEN = 4;             // これ未満は校正に出さない

/* ---------------------------------------------------------
   置換辞書（遅延ゼロ層）
   確定表示の直前に同期で適用する。ここは自由に増やす。
   --------------------------------------------------------- */
const CORRECTIONS = [
  [/ぢゃ/g, "じゃ"],
  [/ぢゅ/g, "じゅ"],
  [/ぢょ/g, "じょ"],
  [/サンディーケー/g, "3DK"],
  [/スリーディーケー/g, "3DK"],
  [/ニディーケー/g,   "2DK"],
  [/ツーディーケー/g, "2DK"],
];

function applyDict(s){
  for (const [re, to] of CORRECTIONS) s = s.replace(re, to);
  return s;
}

/* =========================================================
   状態
   ========================================================= */

let ctx, ws, stream, node, wakeLock = null;
let ready = false;

let sent = 0, utt = 0, uCount = 0;
let correctedCount = 0, correctingCount = 0, rejectedCount = 0;
let finalId = 0;

let previousTexts = [];

$("amiform").addEventListener("submit", e => e.preventDefault());
$("oaiform").addEventListener("submit", e => e.preventDefault());

/* =========================================================
   ログ・統計
   ========================================================= */

function log(msg, cls){
  const t = new Date().toTimeString().slice(0,8);
  $("log").innerHTML += `\n${t}  ${cls ? `<span class="${cls}">${msg}</span>` : msg}`;
  $("log").scrollTop = $("log").scrollHeight;
}

function stats(){
  $("corrCount").textContent = correctedCount;
  $("corrQueue").textContent = correctingCount;
  $("rejCount").textContent  = rejectedCount;
}

/* =========================================================
   自動スクロール
   ユーザーが自分で上に戻している間は追わない
   ========================================================= */

let follow = true;

$("text").addEventListener("scroll", () => {
  const el = $("text");
  follow = (el.scrollHeight - el.scrollTop - el.clientHeight) < 120;
});

function scrollToBottom(){
  if (!follow) return;
  const el = $("text");
  el.scrollTop = el.scrollHeight;
}

/* =========================================================
   発話確定
   ========================================================= */

function addFinal(raw){

  const text = applyDict(String(raw || "").trim());
  if (!text) return;

  const id = ++finalId;

  const p = document.createElement("p");
  p.dataset.id = id;
  p.textContent = text;

  $("text").insertBefore(p, $("interim"));
  $("interim").textContent = "";

  $("utt").textContent = ++utt;
  scrollToBottom();

  log(`A 確定 #${id}: ${text}`, "ok");

  const context = previousTexts.slice(-2);
  previousTexts.push(text);
  if (previousTexts.length > 4) previousTexts.shift();

  if (text.length >= CORRECT_MIN_LEN){
    correctText(id, text, context);
  }
}

/* =========================================================
   校正結果の妥当性検査
   長さが大きく動いていたら「補完された」とみなして棄却する
   ========================================================= */

function isPlausible(orig, corr){
  if (!corr) return false;
  if (corr.length > orig.length * 1.6 + 6) return false;
  if (corr.length < orig.length * 0.5 - 2) return false;
  return true;
}

/* =========================================================
   AI校正
   ========================================================= */

const INSTRUCTIONS = `あなたは日本語音声認識結果の校正エンジンです。
音声認識による明らかな誤認識だけを修正します。

1. 話者が言っていない情報を追加しない。
2. 内容を推測して補完しない。
3. 要約・言い換え・文体変更をしない。
4. 話者の意図を変更しない。
5. 不明な部分は原文を維持する。
6. 明らかな誤認識がなければ原文をそのまま返す。
7. 数字・固有名詞を文脈だけを根拠に変更しない。
8. 出力は校正後の文章のみ。説明・前置き・引用符は禁止。`;

async function correctText(id, text, contextTexts){

  const apiKey = $("openaiKey").value.trim();
  if (!apiKey) return;

  correctingCount++;
  stats();

  const p = document.querySelector(`#text p[data-id="${id}"]`);
  if (p) p.classList.add("correcting");

  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), CORRECT_TIMEOUT);

  try{

    const input =
      (contextTexts.length ? `【直前の発話】\n${contextTexts.join("\n")}\n\n` : "") +
      `【校正対象】\n${text}`;

    const res = await fetch(OPENAI_URL, {
      method:"POST",
      signal: ac.signal,
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + apiKey
      },
      body: JSON.stringify({
        model: OPENAI_MODEL,
        instructions: INSTRUCTIONS,
        input: input,
        store: false,
        max_output_tokens: 300
      })
    });

    if (!res.ok){
      throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0,200)}`);
    }

    const data = await res.json();

    // output_text は SDK の便宜プロパティ。生レスポンスからは output を辿る
    const corrected = String(
      (data.output || [])
        .filter(it => it.type === "message")
        .flatMap(it => it.content || [])
        .filter(c => c.type === "output_text")
        .map(c => c.text)
        .join("")
    ).trim();

    if (!corrected) throw new Error("校正結果が空");

    if (corrected === text){
      log(`校正 #${id}: 変更なし`, "corr");

    } else if (!isPlausible(text, corrected)){
      rejectedCount++;
      log(`校正 #${id}: 棄却（長さ乖離） ${corrected}`, "ng");

    } else {
      const target = document.querySelector(`#text p[data-id="${id}"]`);
      if (target) target.textContent = corrected;
      correctedCount++;
      log(`校正 #${id}: ${text} → ${corrected}`, "corr");
    }

  }catch(e){
    log(`校正 #${id} 失敗: ${e.name === "AbortError" ? "時間切れ" : e.message}`, "ng");

  }finally{
    clearTimeout(timer);
    const target = document.querySelector(`#text p[data-id="${id}"]`);
    if (target) target.classList.remove("correcting");
    correctingCount--;
    stats();
  }
}

/* =========================================================
   AudioWorklet
   ========================================================= */

const workletSrc = `
class Pcm extends AudioWorkletProcessor {
  constructor(opts){
    super();
    this.step = opts.processorOptions.inRate / ${OUT_RATE};
    this.buf  = new Int16Array(${CHUNK});
    this.i    = 0;
    this.pos  = 0;
    this.tail = 0;
    this.tick = 0;
  }
  push(v){
    if (v > 1) v = 1; else if (v < -1) v = -1;
    this.buf[this.i++] = v < 0 ? v * 0x8000 : v * 0x7FFF;
    if (this.i === this.buf.length){
      const out = this.buf;
      this.port.postMessage({ pcm: out.buffer }, [out.buffer]);
      this.buf = new Int16Array(${CHUNK});
      this.i = 0;
    }
  }
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if (!ch || !ch.length) return true;
    const n = ch.length;

    let sum = 0;
    for (let k = 0; k < n; k++) sum += ch[k] * ch[k];
    if ((this.tick++ % 8) === 0){
      this.port.postMessage({ rms: Math.sqrt(sum / n) });
    }

    let p = this.pos;
    while (true){
      const i0 = Math.floor(p);
      if (i0 + 1 >= n) break;
      const a = i0 < 0 ? this.tail : ch[i0];
      const b = ch[i0 + 1];
      this.push(a + (b - a) * (p - i0));
      p += this.step;
    }
    this.tail = ch[n - 1];
    this.pos  = p - n;
    return true;
  }
}
registerProcessor('pcm', Pcm);
`;

/* =========================================================
   開始
   ========================================================= */

$("start").addEventListener("click", async () => {

  const key = $("key").value.trim();
  if (!key){
    log("AmiVoice APPKEY を入力してください。", "ng");
    $("cfg").open = true;
    return;
  }

  $("start").disabled = true;

  const AC = window.AudioContext || window.webkitAudioContext;

  try{
    try { ctx = new AC({ sampleRate: OUT_RATE }); }
    catch(e){ log("sampleRate 指定拒否 → 通常モード"); ctx = new AC(); }
    ctx.resume();
  }catch(e){
    log("AudioContext 生成失敗: " + e.message, "ng");
    $("start").disabled = false;
    return;
  }

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    await ctx.resume();

    // 会議中に画面が消えないようにする（対応していなければ黙って諦める）
    try{
      if (navigator.wakeLock){
        wakeLock = await navigator.wakeLock.request("screen");
        log("画面スリープ防止 有効");
      }
    }catch(e){ log("画面スリープ防止 不可: " + e.message); }

    const inRate = ctx.sampleRate;
    $("sr").textContent  = inRate + " Hz";
    $("out").textContent = OUT_RATE + " Hz";
    log("マイク取得 OK 入力=" + inRate + " Hz", "ok");
    log(inRate === OUT_RATE ? "リサンプル不要"
                            : `リサンプル有効 ${inRate} → ${OUT_RATE} Hz`);

    const url = URL.createObjectURL(
      new Blob([workletSrc], {type:"application/javascript"})
    );
    await ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);

    const src = ctx.createMediaStreamSource(stream);
    node = new AudioWorkletNode(ctx, "pcm", { processorOptions:{ inRate } });

    const mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(node);
    node.connect(mute);
    mute.connect(ctx.destination);

    node.port.onmessage = e => {

      if (e.data.rms !== undefined){
        const db = 20 * Math.log10(e.data.rms || 1e-8);
        $("bar").style.width =
          Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + "%";
        return;
      }

      if (!ready || !ws || ws.readyState !== 1) return;

      const pcm = new Uint8Array(e.data.pcm);
      const frame = new Uint8Array(pcm.length + 1);
      frame[0] = 0x70;                       // 'p'
      frame.set(pcm, 1);
      ws.send(frame);

      sent += pcm.length;
      $("sent").textContent = sent.toLocaleString();
    };

    log("AmiVoice WebSocket 接続中…");
    ws = new WebSocket(WS_URL);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      log("WebSocket 接続 OK", "ok");
      ws.send(`s LSB16K -a-general resultUpdatedInterval=1000 authorization=${key}`);
      log("開始コマンド送信");
    };

    ws.onmessage = ev => {

      const msg  = typeof ev.data === "string" ? ev.data : "";
      const type = msg[0];
      const body = msg.slice(1).trim();

      switch(type){

        case "s":
          if (body){
            log("s コマンド失敗: " + body, "ng");
          }else{
            ready = true;
            $("rec").classList.add("on");
            $("stop").disabled = false;
            log("s 応答 OK — 音声送信開始", "ok");
          }
          break;

        case "e":
          log(body ? "e コマンド失敗: " + body : "e 応答 OK", body ? "ng" : null);
          break;

        case "S": log("S 音声区間開始 " + body); break;
        case "C": log("C 認識開始"); break;
        case "E": log("E 音声区間終了"); break;
        case "G": break;

        case "U":
          try{
            const r = JSON.parse(body);
            uCount++;
            $("uCount").textContent = uCount;
            if (uCount <= 20) log("U 中間: " + (r.text || "(空)"));
            $("interim").textContent = applyDict(r.text || "");
            scrollToBottom();
          }catch(err){
            log("U 解析失敗: " + body, "ng");
          }
          break;

        case "A":
          try{
            const r = JSON.parse(body);
            if (r.code && r.message){
              log("A エラー: " + r.message, "ng");
              $("interim").textContent = "";
              break;
            }
            if (r.text) addFinal(r.text);
          }catch(err){
            log("A 解析失敗: " + body, "ng");
          }
          break;

        default:
          log("未知のパケット: " + msg.slice(0,120));
      }
    };

    ws.onerror = () => log("WebSocket エラー", "ng");
    ws.onclose = ev => {
      $("rec").classList.remove("on");
      log(`WebSocket 切断 code=${ev.code} reason=${ev.reason || "なし"}`);
    };

  }catch(e){
    log(e.name + ": " + e.message, "ng");
    $("start").disabled = false;
  }
});

/* =========================================================
   停止
   ========================================================= */

$("stop").addEventListener("click", () => {

  $("stop").disabled = true;
  ready = false;
  $("rec").classList.remove("on");

  try{ if (ws && ws.readyState === 1) ws.send("e"); }catch(e){}

  if (node)   node.port.onmessage = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx)    ctx.close();

  if (wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }

  $("bar").style.width = "0%";
  $("interim").textContent = "";
  log("停止しました。");

  setTimeout(() => {
    if (ws) ws.close();
    $("start").disabled = false;
  }, 1500);
});

/* =========================================================
   全文コピー
   ========================================================= */

$("copy").addEventListener("click", async () => {
  const lines = [...document.querySelectorAll("#text p[data-id]")]
    .map(p => p.textContent);
  if (!lines.length){ log("コピーする内容がありません。"); return; }
  try{
    await navigator.clipboard.writeText(lines.join("\n"));
    log(`${lines.length} 行をコピーしました。`, "ok");
  }catch(e){
    log("コピー失敗: " + e.message, "ng");
  }
});

</script>
</body>
</html>
